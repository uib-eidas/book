<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle">
  <rect width="960" height="340" fill="#ffffff"/>
  <g stroke="#c9d6e2" stroke-width="2">
    <line x1="320" y1="20" x2="320" y2="320"/>
    <line x1="640" y1="20" x2="640" y2="320"/>
  </g>

  <g font-size="20" font-weight="bold" fill="#0065bd">
    <text x="160" y="44">1. Centralitzat</text>
    <text x="480" y="44">2. Federat</text>
    <text x="800" y="44">3. Descentralitzat</text>
  </g>

  <!-- 1. Centralitzat -->
  <line x1="104" y1="192" x2="175" y2="192" stroke="#0065bd" stroke-width="3"/>
  <circle cx="70" cy="192" r="34" fill="#ffffff" stroke="#0065bd" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="70" y="198" fill="#1a1a1a">Tu</text>
  <rect x="160" y="120" width="140" height="120" rx="10" fill="#e8f1fa" stroke="#0065bd" stroke-width="3"/>
  <text x="230" y="150" fill="#1a1a1a">Organització</text>
  <rect x="175" y="170" width="110" height="44" rx="6" fill="#ffffff" stroke="#0065bd" stroke-width="2"/>
  <text x="230" y="198" fill="#1a1a1a">Compte</text>
  <text x="160" y="300" fill="#444444">Un compte a cada organització</text>

  <!-- 2. Federat -->
  <g stroke="#0065bd" stroke-width="3">
    <line x1="395" y1="200" x2="445" y2="140"/>
    <line x1="515" y1="140" x2="560" y2="200"/>
    <line x1="414" y1="230" x2="510" y2="230" stroke-dasharray="6 5"/>
  </g>
  <rect x="420" y="70" width="120" height="70" rx="10" fill="#e8f1fa" stroke="#0065bd" stroke-width="3"/>
  <text x="480" y="98" fill="#1a1a1a" font-weight="bold">IDP</text>
  <text x="480" y="124" fill="#1a1a1a">Compte</text>
  <circle cx="380" cy="230" r="34" fill="#ffffff" stroke="#0065bd" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="380" y="236" fill="#1a1a1a">Tu</text>
  <rect x="510" y="200" width="120" height="60" rx="10" fill="#e8f1fa" stroke="#0065bd" stroke-width="3"/>
  <text x="570" y="236" fill="#1a1a1a">Organització</text>
  <text x="480" y="300" fill="#444444">Un intermediari gestiona l'accés</text>

  <!-- 3. Descentralitzat -->
  <line x1="754" y1="192" x2="846" y2="192" stroke="#0065bd" stroke-width="5"/>
  <circle cx="720" cy="192" r="34" fill="#e8f1fa" stroke="#0065bd" stroke-width="3"/>
  <text x="720" y="198" fill="#1a1a1a">Tu</text>
  <circle cx="880" cy="192" r="34" fill="#e8f1fa" stroke="#0065bd" stroke-width="3"/>
  <text x="880" y="198" fill="#1a1a1a">Igual</text>
  <text x="800" y="176" fill="#1a1a1a">Connexió</text>
  <text x="800" y="300" fill="#444444">Relació directa entre iguals</text>
</svg>
