<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">
  <defs>
    <marker id="fletxa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0065bd"/>
    </marker>
    <marker id="fletxa-risc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b3541e"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <line x1="480" y1="20" x2="480" y2="310" stroke="#c9d6e2" stroke-width="2"/>

  <g font-weight="bold" font-size="19" fill="#0065bd">
    <text x="240" y="40">Entre parts usuàries</text>
    <text x="720" y="40">Amb l'emissor</text>
  </g>

  <!-- Esquerra -->
  <g stroke="#0065bd" stroke-width="3" marker-end="url(#fletxa)">
    <line x1="126" y1="160" x2="246" y2="112"/>
    <line x1="126" y1="190" x2="246" y2="238"/>
  </g>
  <line x1="330" y1="134" x2="330" y2="214" stroke="#b3541e" stroke-width="3" stroke-dasharray="7 6" marker-start="url(#fletxa-risc)" marker-end="url(#fletxa-risc)"/>
  <circle cx="90" cy="175" r="36" fill="#e8f1fa" stroke="#0065bd" stroke-width="3"/>
  <text x="90" y="181" fill="#1a1a1a" font-weight="bold">Cartera</text>
  <g fill="#e8f1fa" stroke="#0065bd" stroke-width="3">
    <rect x="250" y="80" width="160" height="50" rx="10"/>
    <rect x="250" y="218" width="160" height="50" rx="10"/>
  </g>
  <g fill="#1a1a1a" font-weight="bold">
    <text x="330" y="111">Part usuària A</text>
    <text x="330" y="249">Part usuària B</text>
  </g>
  <text x="342" y="180" fill="#b3541e" text-anchor="start">Comparen</text>
  <text x="240" y="305" fill="#444444">Dues presentacions del mateix usuari?</text>

  <!-- Dreta -->
  <g stroke="#0065bd" stroke-width="3" marker-end="url(#fletxa)">
    <line x1="660" y1="122" x2="592" y2="190"/>
    <line x1="608" y1="225" x2="756" y2="225"/>
  </g>
  <line x1="826" y1="196" x2="770" y2="124" stroke="#b3541e" stroke-width="3" stroke-dasharray="7 6" marker-start="url(#fletxa-risc)" marker-end="url(#fletxa-risc)"/>
  <rect x="640" y="70" width="160" height="50" rx="10" fill="#e8f1fa" stroke="#0065bd" stroke-width="3"/>
  <text x="720" y="101" fill="#1a1a1a" font-weight="bold">Emissor</text>
  <circle cx="570" cy="225" r="36" fill="#e8f1fa" stroke="#0065bd" stroke-width="3"/>
  <text x="570" y="231" fill="#1a1a1a" font-weight="bold">Cartera</text>
  <rect x="760" y="200" width="160" height="50" rx="10" fill="#e8f1fa" stroke="#0065bd" stroke-width="3"/>
  <text x="840" y="231" fill="#1a1a1a" font-weight="bold">Part usuària</text>
  <text x="604" y="150" fill="#1a1a1a">Emet</text>
  <text x="682" y="215" fill="#1a1a1a">Presenta</text>
  <text x="812" y="155" fill="#b3541e" text-anchor="start">Comparteixen</text>
  <text x="720" y="305" fill="#444444">On fa servir l'usuari les seves declaracions?</text>
</svg>
