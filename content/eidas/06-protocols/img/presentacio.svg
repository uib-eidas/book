<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
  <defs>
    <marker id="fletxa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0065bd"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>

  <g stroke="#c9d6e2" stroke-width="3" stroke-dasharray="6 6">
    <line x1="120" y1="62" x2="120" y2="425"/>
    <line x1="480" y1="62" x2="480" y2="425"/>
    <line x1="840" y1="62" x2="840" y2="425"/>
  </g>

  <g fill="#e8f1fa" stroke="#0065bd" stroke-width="3">
    <rect x="40" y="18" width="160" height="44" rx="10"/>
    <rect x="390" y="18" width="180" height="44" rx="10"/>
    <rect x="750" y="18" width="180" height="44" rx="10"/>
  </g>
  <g font-weight="bold" font-size="17" fill="#1a1a1a">
    <text x="120" y="46">Usuari</text>
    <text x="480" y="46">Unitat de cartera</text>
    <text x="840" y="46">Part usuària</text>
  </g>

  <g stroke="#0065bd" stroke-width="3" marker-end="url(#fletxa)">
    <line x1="122" y1="105" x2="836" y2="105"/>
    <line x1="838" y1="150" x2="484" y2="150"/>
    <line x1="478" y1="250" x2="124" y2="250"/>
    <line x1="122" y1="295" x2="476" y2="295"/>
    <line x1="482" y1="340" x2="836" y2="340"/>
  </g>

  <g fill="#fff4e0" stroke="#b3541e" stroke-width="2">
    <rect x="330" y="170" width="300" height="46" rx="8"/>
    <rect x="690" y="364" width="250" height="46" rx="8"/>
  </g>

  <g fill="#1a1a1a">
    <text x="300" y="96">1. Vol accedir a un servei</text>
    <text x="660" y="141">2. Petició de presentació: quins atributs vol</text>
    <text x="480" y="190">3. Autentica la part usuària i</text>
    <text x="480" y="207">comprova què té registrat</text>
    <text x="300" y="241">4. Mostra qui demana què</text>
    <text x="300" y="286">5. S'autentica i ho aprova</text>
    <text x="660" y="331">6. Atributs triats i prova de possessió</text>
    <text x="815" y="384">7. Verifica signatura, revocació</text>
    <text x="815" y="401">i vinculació al dispositiu</text>
  </g>
</svg>
