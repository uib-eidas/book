  <text x="610" y="146" fill="#444444" font-size="14">Navegador amb codi QR</text>
  <g fill="#0065bd" font-weight="bold" font-size="16">
    <circle cx="610" cy="204" r="13" fill="#ffffff" stroke="#0065bd" stroke-width="2"/>
    <text x="610" y="210">1</text>
    <circle cx="752" cy="130" r="13" fill="#ffffff" stroke="#0065bd" stroke-width="2"/>
    <text x="752" y="136">2</text>
    <circle cx="746" cy="262" r="13" fill="#ffffff" stroke="#0065bd" stroke-width="2"/>
    <text x="746" y="268">3</text>
  </g>

  <g fill="#444444">
    <text x="240" y="364">1. El lloc web demana dades · 2. S'obre la cartera</text>
    <text x="240" y="384">3. La cartera respon</text>
    <text x="720" y="364">1. El lloc web mostra un codi QR · 2. El mòbil l'escaneja</text>
    <text x="720" y="384">3. La cartera respon</text>
