    <text x="284" y="144">1</text>
    <circle cx="155" cy="196" r="13" fill="#ffffff" stroke="#0065bd" stroke-width="2"/>
    <text x="155" y="202">2</text>
    <circle cx="284" cy="254" r="13" fill="#ffffff" stroke="#0065bd" stroke-width="2"/>
    <text x="284" y="260">3</text>
  </g>

  <!-- Dreta: ordinador i mòbil -->
  <rect x="790" y="60" width="130" height="270" rx="22" fill="#f6f9fc" stroke="#0065bd" stroke-width="3"/>
  <text x="855" y="86" fill="#0065bd" font-weight="bold">Mòbil</text>
  <g stroke="#0065bd" stroke-width="3" marker-end="url(#fletxa)">
    <line x1="610" y1="162" x2="610" y2="246"/>
    <line x1="798" y1="254" x2="694" y2="270"/>
  </g>
  <line x1="798" y1="130" x2="708" y2="130" stroke="#0065bd" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#fletxa)"/>
  <g fill="#e8f1fa" stroke="#0065bd" stroke-width="3">
    <rect x="520" y="100" width="180" height="60" rx="10"/>
    <rect x="530" y="250" width="160" height="60" rx="10"/>
    <rect x="800" y="170" width="110" height="100" rx="10"/>
  </g>
  <g font-weight="bold" font-size="17" fill="#1a1a1a">
