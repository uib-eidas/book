<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">
  <defs>
    <marker id="fletxa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0065bd"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <line x1="480" y1="20" x2="480" y2="340" stroke="#c9d6e2" stroke-width="2"/>

  <g font-weight="bold" font-size="20" fill="#0065bd">
    <text x="240" y="38">Mateix dispositiu</text>
    <text x="720" y="38">Entre dispositius</text>
  </g>

  <!-- Esquerra: un sol mòbil -->
  <rect x="60" y="60" width="190" height="270" rx="22" fill="#f6f9fc" stroke="#0065bd" stroke-width="3"/>
  <text x="155" y="86" fill="#0065bd" font-weight="bold">Mòbil</text>
  <g stroke="#0065bd" stroke-width="3" marker-end="url(#fletxa)">
    <line x1="232" y1="130" x2="316" y2="176"/>
