    <text x="660" y="260">El gestiona un prestador qualificat de serveis</text>
    <text x="660" y="280">de confiança, en nom del signant</text>
  </g>
  <g fill="#0065bd" font-weight="bold">
    <text x="336" y="104">Local</text>
    <text x="336" y="246">Remota</text>
