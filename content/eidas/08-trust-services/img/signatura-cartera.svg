  </g>

  <g font-weight="bold" font-size="19" fill="#1a1a1a">
    <text x="170" y="164">Unitat de cartera</text>
    <text x="660" y="74">Dispositiu qualificat local</text>
    <text x="660" y="234">Dispositiu qualificat remot</text>
  </g>
  <g fill="#1a1a1a">
