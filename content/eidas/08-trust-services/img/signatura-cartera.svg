<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">
  <defs>
    <marker id="fletxa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0065bd"/>
    </marker>
  </defs>
  <rect width="960" height="340" fill="#ffffff"/>

  <g stroke="#0065bd" stroke-width="3" marker-end="url(#fletxa)">
    <line x1="282" y1="150" x2="416" y2="92"/>
    <line x1="282" y1="190" x2="416" y2="248"/>
  </g>

  <g fill="#e8f1fa" stroke="#0065bd" stroke-width="3">
