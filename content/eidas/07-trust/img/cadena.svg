<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">
  <defs>
    <marker id="fletxa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0065bd"/>
    </marker>
  </defs>
  <rect width="960" height="250" fill="#ffffff"/>

  <g stroke="#0065bd" stroke-width="3" marker-end="url(#fletxa)">
    <line x1="222" y1="85" x2="272" y2="85"/>
    <line x1="468" y1="85" x2="518" y2="85"/>
    <line x1="714" y1="85" x2="764" y2="85"/>
  </g>

  <g fill="#e8f1fa" stroke="#0065bd" stroke-width="3">
    <rect x="30" y="50" width="190" height="70" rx="10"/>
    <rect x="276" y="50" width="190" height="70" rx="10"/>
    <rect x="522" y="50" width="190" height="70" rx="10"/>
  </g>
  <rect x="768" y="50" width="172" height="70" rx="10" fill="#fff4e0" stroke="#b3541e" stroke-width="3"/>

  <g font-weight="bold" font-size="17" fill="#1a1a1a">
    <text x="125" y="80">Petició de</text>
    <text x="125" y="102">presentació</text>
    <text x="371" y="80">Certificat</text>
    <text x="371" y="102">d'accés</text>
    <text x="617" y="80">Certificats</text>
    <text x="617" y="102">intermedis</text>
    <text x="854" y="80">Àncora de</text>
    <text x="854" y="102">confiança</text>
  </g>

  <g fill="#444444">
    <text x="125" y="144">Signada per la</text>
    <text x="125" y="162">part usuària</text>
    <text x="371" y="144">Identifica la</text>
    <text x="371" y="162">part usuària</text>
    <text x="617" y="144">De l'autoritat de</text>
    <text x="617" y="162">certificats d'accés</text>
    <text x="854" y="144">Publicada a la llista</text>
    <text x="854" y="162">d'entitats de confiança</text>
  </g>

  <text x="480" y="218" font-size="15" fill="#1a1a1a">La cartera verifica cada baula, fins a l'àncora, i que cap certificat hagi estat revocat.</text>
</svg>
